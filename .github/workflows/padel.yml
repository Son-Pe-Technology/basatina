# Pistas de pádel de Navarra (tools/padel.py). Se ejecuta el día 15 de cada mes, cuando cambia tools/padel.py, o a mano desde la pestaña Actions.
name: "Pistas de pádel"
on:
  push:
    paths: ['tools/padel.py', '.github/workflows/padel.yml']
  schedule:
    - cron: '41 4 15 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  padel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: python3 tools/padel.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/padel_info.txt web/padel.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Pádel: pistas actualizadas" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
