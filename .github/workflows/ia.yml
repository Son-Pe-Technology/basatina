# 🤖 IA de BasatiNA (23 nov. 2026): noticias propias (borradores) y «Navarra hoy».
#   tools/ia_noticias.py → noticias/ia_borradores.json (cada 3 h de 7 a 22 h, hora de Madrid en invierno)
#   tools/ia_hoy.py      → noticias/navarra_hoy.json   (a las 7:20)
# La clave va en el secreto ANTHROPIC_API_KEY. Si hay dudas, se acaba el saldo o falla la clave,
# el robot abre un aviso (issue con la etiqueta «ia») y GitHub manda un correo.
name: "IA: noticias propias y Navarra hoy"
on:
  schedule:
    - cron: '5 6-21/3 * * *'    # noticias
    - cron: '20 6 * * *'        # Navarra hoy
  push:
    branches: [main]
    paths: ['tools/ia.py', 'tools/ia_noticias.py', 'tools/ia_hoy.py', '.github/workflows/ia.yml']
  workflow_dispatch:
    inputs:
      tarea:
        description: 'noticias, hoy o las-dos'
        default: 'las-dos'
permissions:
  contents: write
  issues: write
concurrency: ia
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Noticias propias
        if: github.event.schedule != '20 6 * * *' && github.event.inputs.tarea != 'hoy'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ia_noticias.py
      - name: Navarra hoy
        if: github.event.schedule == '20 6 * * *' || github.event_name == 'push' || github.event.inputs.tarea == 'hoy' || github.event.inputs.tarea == 'las-dos'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ia_hoy.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add noticias/
          git commit -m "IA: noticias propias / Navarra hoy" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*10)); done
