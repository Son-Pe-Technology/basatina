# 🤖 IA de BasatiNA (23 nov. 2026): noticias propias (borradores) y «Navarra hoy».
#   tools/ia_noticias.py → ia_borradores.json en el repositorio PRIVADO basatina-borradores (llave: secreto BORRADORES_TOKEN)
#                          las seguras las publica sola en noticias/ia_publicadas.json (público); el resto, desde la app
#   (cada 3 h de 7 a 22 h, hora de Madrid en invierno)
#   tools/ia_hoy.py      → noticias/navarra_hoy.json   (a las 5:40 hora de Madrid, listo para el desayuno de las 6:30;
#                          dos horarios en UTC para que valga en invierno y en verano: solo se hace una vez al día)
# La clave va en el secreto ANTHROPIC_API_KEY. Si hay dudas, se acaba el saldo o falla la clave,
# el robot abre un aviso (issue con la etiqueta «ia») y GitHub manda un correo.
name: "IA: noticias propias y Navarra hoy"
on:
  schedule:
    - cron: '5 6-21/3 * * *'    # noticias
    - cron: '40 3 * * *'        # Navarra hoy (5:40 en verano)
    - cron: '40 4 * * *'        # Navarra hoy (5:40 en invierno)
  push:
    branches: [main]
    paths: ['tools/ia.py', 'tools/ia_noticias.py', 'tools/ia_hoy.py', '.github/workflows/ia.yml']
  workflow_dispatch:
    inputs:
      tarea:
        description: 'noticias, hoy o las-dos'
        default: 'las-dos'
permissions:
  contents: write
  issues: write
concurrency: ia
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bajar los borradores (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Son-Pe-Technology/basatina-borradores
          token: ${{ secrets.BORRADORES_TOKEN }}
          path: priv
      - name: Noticias propias
        if: github.event.schedule != '40 3 * * *' && github.event.schedule != '40 4 * * *' && github.event.inputs.tarea != 'hoy'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IA_AUTO: '1'          # '0' = no publica nada sola (todo a revisión a mano)
        run: python3 tools/ia_noticias.py
      - name: Navarra hoy
        if: github.event.schedule == '40 3 * * *' || github.event.schedule == '40 4 * * *' || github.event_name == 'push' || github.event.inputs.tarea == 'hoy' || github.event.inputs.tarea == 'las-dos'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Con horario: solo entre las 5 y las 9 de la mañana (hora de Madrid) y si hoy no está hecho ya.
          # Así en invierno no sale a las 4:40 y en verano no se repite a las 6:40 (no gasta crédito dos veces).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Europe/Madrid date +%-H); HOY=$(TZ=Europe/Madrid date +%F)
            if [ "$H" -lt 5 ] || [ "$H" -gt 9 ]; then echo "Fuera de hora ($H h): nada"; exit 0; fi
            if python3 -c "import json,sys;sys.exit(0 if json.load(open('noticias/navarra_hoy.json')).get('f')=='$HOY' else 1)" 2>/dev/null; then echo "Navarra hoy ya está hecho"; exit 0; fi
          fi
          python3 tools/ia_hoy.py
      - name: Guardar los borradores (repositorio privado)
        run: |
          cd priv
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A .
          git commit -m "IA: borradores" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*10)); done
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A noticias/
          git commit -m "IA: noticias propias / Navarra hoy" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*10)); done
