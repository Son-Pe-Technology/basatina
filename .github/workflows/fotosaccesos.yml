# Fotos libres para los accesos directos del Inicio sin foto (tools/fotos_accesos_libres.py). Al cambiar ese archivo o a mano.
name: "Fotos libres para los accesos directos (Wikimedia Commons)"
on:
  push:
    paths: ['tools/fotos_accesos_libres.py', '.github/workflows/fotosaccesos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotosaccesos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: pip install pillow
      - name: Buscar fotos
        run: python3 tools/fotos_accesos_libres.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A web/ tools/fotosaccesos_info.txt
          git commit -m "Fotos libres para los accesos directos" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/ && git commit -m "Nueva versión de la pantalla" || true
          done
