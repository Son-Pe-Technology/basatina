# Mascotas: veterinarios, zonas para perros y protectoras (tools/mascotas.py). Se ejecuta el día 11 de cada mes, cuando cambia tools/mascotas.py, o a mano desde la pestaña Actions.
name: Mascotas: veterinarios, zonas para perros y protectoras
on:
  push:
    paths: ['tools/mascotas.py']
  schedule:
    - cron: '23 5 11 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mascotas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: python3 tools/mascotas.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/mascotas_info.txt web/mascotas.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Mascotas: veterinarios, zonas para perros y protectoras actualizados" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
