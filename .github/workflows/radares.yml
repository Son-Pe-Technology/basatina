# Radares de velocidad (tools/radares.py). Se ejecuta cada lunes, cuando cambia tools/radares.py, o a mano desde la pestaña Actions.
name: Radares de velocidad
on:
  push:
    paths: ['tools/radares.py']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radares:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: python3 tools/radares.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/radares_info.txt web/radares.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Radares de velocidad actualizados" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
