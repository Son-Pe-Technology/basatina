# Busca fotos candidatas en Wikimedia Commons (tools/fotos_buscar.py). Solo en ramas fotos-candidatas-*: no toca la app.
name: "Buscar fotos candidatas (Wikimedia Commons)"
on:
  push:
    branches: ['fotos-candidatas-*']
    paths: ['tools/fotos_buscar.py']
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fotos_buscar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/candidatas
          git commit -m "Fotos candidatas" || exit 0
          git push
