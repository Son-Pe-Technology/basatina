# Fotos libres para los titulares mientras no haya propias (tools/fotos_titulares_libres.py). Solo a mano desde Actions (las fotos se revisaron a mano).
name: "Fotos libres para los titulares (Wikimedia Commons)"
on:
  workflow_dispatch:   # solo a mano: las fotos ya están revisadas una a una (26 nov. 2026)
permissions:
  contents: write
jobs:
  fotostitulares:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: pip install pillow
      - name: Buscar fotos
        run: python3 tools/fotos_titulares_libres.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A web/ tools/fotostitulares_info.txt
          git commit -m "Fotos libres para los titulares" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
