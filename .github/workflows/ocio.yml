# Ocio: cartelera de cine (cada día) y rutas en moto (los lunes) con tools/ocio.py. También cuando cambia tools/ocio.py o a mano desde Actions.
name: Ocio (cartelera de cine y rutas en moto)
on:
  push:
    paths: ['tools/ocio.py']
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" != "schedule" ]; then python3 tools/ocio.py; else python3 tools/ocio.py --cines; fi
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tools/ocio_info.txt web/ocio.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Ocio actualizado" || exit 0
          git pull --rebase
          python3 tools/make_version.py
          git add web/version.json
          git commit -m "Nueva versión de la pantalla" || true
          for i in 1 2 3 4 5 6; do
            git push && break
            sleep $((i*15))
            git pull --rebase -X theirs || true
            python3 tools/make_version.py && git add web/version.json && git commit -m "Nueva versión de la pantalla" || true
          done
