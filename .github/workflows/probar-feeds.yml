name: Probar feeds (temporal)
on:
  push:
    branches: [probar-curiosas]
    paths: ['tools/probar_feeds.txt']
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probar_feeds.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add tools/probar_feeds.json; git commit -m "Resultado prueba feeds" || exit 0; git push
