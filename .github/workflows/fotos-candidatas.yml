# Busca fotos libres en Wikimedia Commons (solo se ejecuta al subir a una rama «fotos-…»).
name: Fotos candidatas (Commons)
on:
  push:
    branches: ['fotos-*']
    paths: ['tools/fotos_commons.py', '.github/workflows/fotos-candidatas.yml']
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fotos_commons.py
      - run: |
          git config user.name "basatina-bot"; git config user.email "bot@basatina.es"
          git add fotos/candidatas && git commit -m "Fotos candidatas de Commons" && git push || echo "nada nuevo"
