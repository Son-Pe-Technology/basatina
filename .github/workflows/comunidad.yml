# Limpieza nocturna de la Comunidad de avisos (tools/comunidad_limpieza.py).
# Necesita los secretos CM_ADMIN_EMAIL y CM_ADMIN_PASS (Settings → Secrets and variables → Actions).
# Limpieza de cuentas (tools/cuentas_limpieza.py): necesita además el secreto FIREBASE_SA (clave de la cuenta de servicio).
name: Limpieza de la comunidad
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'Cuentas: solo contar lo que se borraría, sin borrar (sí/no)'
        default: 'no'
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Limpiar avisos caducados
        env:
          CM_ADMIN_EMAIL: ${{ secrets.CM_ADMIN_EMAIL }}
          CM_ADMIN_PASS: ${{ secrets.CM_ADMIN_PASS }}
        run: python3 tools/comunidad_limpieza.py
      - name: Limpiar cuentas sin confirmar o sin usar
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CM_ADMIN_EMAIL: ${{ secrets.CM_ADMIN_EMAIL }}
          SIMULAR: ${{ github.event.inputs.simular == 'sí' && '1' || '0' }}
        run: |
          pip install --quiet google-auth requests
          python3 tools/cuentas_limpieza.py
